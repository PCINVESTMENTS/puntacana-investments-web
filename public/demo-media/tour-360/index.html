<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Virtual 360° Interactivo — Punta Cana Investments</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #viewer.dragging { cursor: grabbing; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .pill {
      pointer-events: auto;
      background: rgba(9, 9, 11, 0.82);
      border: 1px solid rgba(212, 175, 55, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f3e5ab;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .rooms {
      display: inline-flex;
      gap: 6px;
      pointer-events: auto;
    }
    .room-btn {
      background: rgba(9, 9, 11, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e4e4e7;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .room-btn.active, .room-btn:hover {
      background: #d4af37;
      border-color: #d4af37;
      color: #09090b;
    }
    .hud-bottom {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .hint {
      background: rgba(9, 9, 11, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: #d4d4d8;
    }
    .controls {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(9, 9, 11, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #f3e5ab;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .ctrl-btn:hover {
      background: #d4af37;
      color: #09090b;
    }
    .compass {
      position: absolute;
      bottom: 54px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(9, 9, 11, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .compass-needle {
      width: 2px;
      height: 22px;
      background: linear-gradient(to bottom, #d4af37 50%, rgba(255,255,255,0.25) 50%);
      transform-origin: center;
    }
  </style>
</head>
<body>
  <div id="viewer" data-tour360-ready="false" data-tour-yaw="0" data-tour-pitch="0" data-tour-zoom="100" data-tour-room="interior" data-tour-moved="false">
    <canvas id="panoCanvas" aria-label="Recorrido virtual interactivo 360 grados"></canvas>

    <div class="hud-top">
      <div class="pill" data-tour-hud="true">
        <span class="dot"></span>
        <span>TOUR 360°</span>
        <span id="readout">Rumbo: 0° · Inclinación: 0°</span>
      </div>
      <div class="rooms">
        <button type="button" class="room-btn active" data-room-btn="interior">Sala &amp; Cocina</button>
        <button type="button" class="room-btn" data-room-btn="terrace">Piscina &amp; Rooftop</button>
      </div>
    </div>

    <div class="compass" aria-hidden="true">
      <div class="compass-needle" id="compassNeedle"></div>
    </div>

    <div class="hud-bottom">
      <div class="hint">Arrastra con el mouse o usa las flechas para girar la vista 360°</div>
      <div class="controls">
        <button type="button" class="ctrl-btn" id="btnLeft" title="Girar izquierda" aria-label="Girar izquierda" data-tour-ctrl="left">←</button>
        <button type="button" class="ctrl-btn" id="btnRight" title="Girar derecha" aria-label="Girar derecha" data-tour-ctrl="right">→</button>
        <button type="button" class="ctrl-btn" id="btnUp" title="Inclinar arriba" aria-label="Inclinar arriba" data-tour-ctrl="up">↑</button>
        <button type="button" class="ctrl-btn" id="btnDown" title="Inclinar abajo" aria-label="Inclinar abajo" data-tour-ctrl="down">↓</button>
        <button type="button" class="ctrl-btn" id="btnZoomIn" title="Acercar" aria-label="Acercar" data-tour-ctrl="zoom-in">+</button>
        <button type="button" class="ctrl-btn" id="btnZoomOut" title="Alejar" aria-label="Alejar" data-tour-ctrl="zoom-out">−</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const ROOMS = {
        interior: { src: "./room-interior-360.jpg", label: "Sala & Cocina" },
        terrace: { src: "./room-terrace-360.jpg", label: "Piscina & Rooftop" }
      };

      const viewer = document.getElementById("viewer");
      const canvas = document.getElementById("panoCanvas");
      const ctx = canvas.getContext("2d");
      const readout = document.getElementById("readout");
      const needle = document.getElementById("compassNeedle");

      let currentRoom = "interior";
      let yaw = 0;        // degrees 0..360
      let pitch = 0;      // degrees -25..25
      let zoom = 1.0;     // 0.85..1.8
      let hasMoved = false;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      const loadedImages = {};

      function normalizeYaw(deg) {
        let v = deg % 360;
        if (v < 0) v += 360;
        return v;
      }

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(320, Math.floor(viewer.clientWidth * dpr));
        canvas.height = Math.max(180, Math.floor(viewer.clientHeight * dpr));
        render();
      }

      function syncHud() {
        const yDeg = Math.round(normalizeYaw(yaw));
        const pDeg = Math.round(pitch);
        const zPct = Math.round(zoom * 100);
        viewer.setAttribute("data-tour-yaw", String(yDeg));
        viewer.setAttribute("data-tour-pitch", String(pDeg));
        viewer.setAttribute("data-tour-zoom", String(zPct));
        viewer.setAttribute("data-tour-room", currentRoom);
        viewer.setAttribute("data-tour-moved", hasMoved ? "true" : "false");
        readout.textContent = "Rumbo: " + yDeg + "° · Inclinación: " + pDeg + "°";
        needle.style.transform = "rotate(" + yDeg + "deg)";
      }

      function render() {
        const img = loadedImages[currentRoom];
        const cw = canvas.width;
        const ch = canvas.height;
        ctx.fillStyle = "#09090b";
        ctx.fillRect(0, 0, cw, ch);
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        // Cylindrical 360 projection: horizontal FOV based on zoom (default ~95 deg of 360 deg strip)
        const fovX = clamp(95 / zoom, 45, 120);
        const srcSpanW = (fovX / 360) * iw;
        const srcSpanH = clamp(ih / zoom, ih * 0.45, ih);

        const centerU = (normalizeYaw(yaw) / 360) * iw;
        const startU = (centerU - srcSpanW / 2 + iw) % iw;

        // Vertical pitch offset
        const maxOffsetV = Math.max(0, (ih - srcSpanH) / 2);
        const pitchRatio = clamp(pitch / 25, -1, 1);
        const startV = clamp((ih - srcSpanH) / 2 - pitchRatio * maxOffsetV, 0, ih - srcSpanH);

        // Render in vertical slices for subtle spherical barrel perspective & seamless 360 wrap
        const slices = 48;
        const dstSliceW = Math.ceil(cw / slices);
        for (let i = 0; i < slices; i++) {
          const t = (i + 0.5) / slices - 0.5; // -0.5..0.5
          const u = (startU + (i / slices) * srcSpanW) % iw;
          const sw = Math.max(1, srcSpanW / slices);
          const safeSw = Math.min(sw, iw - u);
          // Subtle spherical perspective curve near left/right edges
          const curve = 1 + 0.06 * (t * t * 4);
          const dh = ch * curve;
          const dy = (ch - dh) / 2;
          ctx.drawImage(img, u, startV, safeSw, srcSpanH, i * (cw / slices), dy, dstSliceW + 1, dh);
        }

        syncHud();
      }

      function moveView(dYaw, dPitch, dZoom) {
        yaw = normalizeYaw(yaw + dYaw);
        pitch = clamp(pitch + dPitch, -25, 25);
        zoom = clamp(zoom + (dZoom || 0), 0.85, 1.8);
        hasMoved = true;
        render();
      }

      function loadRoom(roomKey) {
        currentRoom = roomKey;
        document.querySelectorAll("[data-room-btn]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-room-btn") === roomKey);
        });
        if (loadedImages[roomKey] && loadedImages[roomKey].complete) {
          viewer.setAttribute("data-tour360-ready", "true");
          render();
          return;
        }
        const img = new Image();
        img.onload = function () {
          loadedImages[roomKey] = img;
          viewer.setAttribute("data-tour360-ready", "true");
          render();
        };
        img.src = ROOMS[roomKey].src;
      }

      // Pointer & Mouse drag controls
      function onDown(x, y) {
        dragging = true;
        lastX = x;
        lastY = y;
        viewer.classList.add("dragging");
      }
      function onMove(x, y) {
        if (!dragging) return;
        const dx = x - lastX;
        const dy = y - lastY;
        lastX = x;
        lastY = y;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
          moveView(-dx * 0.35, dy * 0.18, 0);
        }
      }
      function onUp() {
        dragging = false;
        viewer.classList.remove("dragging");
      }

      canvas.addEventListener("pointerdown", function (e) {
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }
        onDown(e.clientX, e.clientY);
      });
      canvas.addEventListener("pointermove", function (e) { onMove(e.clientX, e.clientY); });
      canvas.addEventListener("pointerup", onUp);
      canvas.addEventListener("pointercancel", onUp);

      canvas.addEventListener("wheel", function (e) {
        e.preventDefault();
        moveView(0, 0, e.deltaY < 0 ? 0.12 : -0.12);
      }, { passive: false });

      window.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") moveView(-20, 0, 0);
        else if (e.key === "ArrowRight") moveView(20, 0, 0);
        else if (e.key === "ArrowUp") moveView(0, 8, 0);
        else if (e.key === "ArrowDown") moveView(0, -8, 0);
      });

      document.getElementById("btnLeft").addEventListener("click", function () { moveView(-35, 0, 0); });
      document.getElementById("btnRight").addEventListener("click", function () { moveView(35, 0, 0); });
      document.getElementById("btnUp").addEventListener("click", function () { moveView(0, 10, 0); });
      document.getElementById("btnDown").addEventListener("click", function () { moveView(0, -10, 0); });
      document.getElementById("btnZoomIn").addEventListener("click", function () { moveView(0, 0, 0.2); });
      document.getElementById("btnZoomOut").addEventListener("click", function () { moveView(0, 0, -0.2); });

      document.querySelectorAll("[data-room-btn]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          hasMoved = true;
          loadRoom(btn.getAttribute("data-room-btn"));
        });
      });

      window.addEventListener("resize", resize);
      resize();
      loadRoom("interior");
    })();
  </script>
</body>
</html>
